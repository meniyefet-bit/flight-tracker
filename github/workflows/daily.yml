name: Daily flight scan

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: flight-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install faster-flights typing_extensions

      - name: Run agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent.py

      - name: Save data
        if: always()
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add config.json history.json state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update flight data"
            git pull --rebase
            git push
          fi
