name: Scan test

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install fast-flights typing_extensions

      - name: Run scan test
        run: python scan_test.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: out/
