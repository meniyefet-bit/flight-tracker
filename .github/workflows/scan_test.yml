name: Scan test

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fast-flights
        run: pip install fast-flights typing_extensions

      - name: Probe with fast-flights
        continue-on-error: true
        env:
          PROBE_LABEL: fast-flights
        run: python scan_test.py

      - name: Switch to faster-flights
        continue-on-error: true
        run: |
          pip uninstall -y fast-flights
          pip install faster-flights typing_extensions

      - name: Probe with faster-flights
        continue-on-error: true
        env:
          PROBE_LABEL: faster-flights
        run: python scan_test.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: out/
